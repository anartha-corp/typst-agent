# Golden backlog registry for typst-agent.
#
# This file is the durable memory of the mining pipeline. `cargo agent
# backlog` scores each entry deterministically: demand is derived from the
# frozen snapshot, and confidence/safety/impact/burden are annotated here.
# Scores are therefore reproducible; never hand-edit a number to move a tier.
#
# Status lifecycle: candidate -> mined -> shipped | watch | excluded | upstream-shipped
# Stance: endorsing | neutral | skeptical | planned | none
# Exclusion reasons: upstream-active, upstream-pr-active, security-sandbox,
#                    upstream-skeptical, roadmap-tracking, not-planned (derived)

version = 1

[calibration]
# Known-good reference mines: must always score into tier a/b.
reference_mines = [2722, 6059]
# Known-bad candidates: the scorer must always exclude them.
known_bad = [1765, 955, 5382]

