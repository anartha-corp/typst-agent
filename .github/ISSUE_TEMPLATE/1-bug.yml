name: 🐞 Compiler Bug Report
description: For bugs in the Typst Agent downstream compiler
title: Write a short and descriptive title!
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug in Typst Agent. Please search the downstream issue tracker first. This tracker is for downstream behavior; do not submit issues or patches to the upstream Typst repository from this form.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe your issue in Typst Agent. Include specific steps to reproduce it or a screenshot if the problem is with compiler output.
      placeholder: Terse and specific description of the bug. If possible, include (minimal) Typst code that reproduces problem. You can add a screenshot by dragging an image here.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Which platform did you run the compiler on?
      multiple: true
      options:
        - Web app
        - Windows
        - Linux
        - macOS
    validations:
      required: false
  - type: checkboxes
    id: updated
    attributes:
      label: Typst version
      description: Please check this box to confirm you are using the latest Typst Agent release or an unreleased commit from this repository.
      options:
        - label: I am using the latest version of Typst Agent
          required: false
