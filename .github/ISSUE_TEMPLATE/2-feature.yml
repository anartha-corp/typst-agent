name: 🪴 Compiler Feature Request
description: For feature requests for the Typst Agent downstream compiler
title: Write a short and descriptive title!
labels:
  - feature request
body:
  - type: markdown
    attributes:
      value: Thanks for sharing your feature request for Typst Agent. Please search the downstream issue tracker first. Requests submitted here are for this downstream only and must not be forwarded to the upstream Typst repository.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe your feature request. You can also add a mockup if you are requesting a new output feature!
      placeholder: Terse and specific description of the feature. You can add an image by dragging a file here.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Please describe why this feature would be useful.
      placeholder: Describe what users can accomplish with this feature and whom it might be useful for.
    validations:
      required: true
