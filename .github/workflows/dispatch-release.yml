name: Dispatch Typst Agent release

# The immutable release workflow requires its dispatch actor to be exactly
# typst-agent-pr-bot[bot]. This helper lets the human maintainer trigger that
# dispatch without exposing the App private key: the App installation token is
# minted inside Actions from the repository secret and is never printed.
#
# release.yml keeps its own gates (exact main commit, upstream boundary,
# environment approval). This workflow only relays the request.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable downstream release tag
        required: true
        type: string

permissions: {}

concurrency:
  group: release-dispatch-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch release workflow as the PR bot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the human maintainer actor
        run: test "$GITHUB_ACTOR" = rixzkiye

      - name: Checkout exact main source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Mint repository-scoped PR-bot App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TYPST_AGENT_PR_BOT_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-contents: read
          private-key: ${{ secrets.TYPST_AGENT_PR_BOT_PRIVATE_KEY }}
          repositories: typst-agent

      - name: Require the dedicated PR-bot App actor
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: test "$APP_SLUG" = typst-agent-pr-bot

      - name: Verify exact main source and release tag shape
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-agent\.[0-9]+$ ]]

      - name: Dispatch the immutable release workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f "inputs[release_tag]=$RELEASE_TAG"
