name: Downstream CI

on:
  push:
    branches: [main, 'execute-plan/**']
  pull_request:
  merge_group:

permissions:
  actions: read
  contents: read
  deployments: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  policy:
    name: Policy and agent PR lane
    needs: reference-detect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Configure fetch-only upstream
        run: |
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/typst/typst.git
          git remote set-url --push upstream https://invalid.example/typst/typst.git
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Determine immutable base
        id: base
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base="$EVENT_BASE_SHA"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] || \
            ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base="$(git merge-base origin/main HEAD)"
          fi
          git rev-parse --verify "$base^{commit}" >/dev/null
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Doctor and policy
        run: |
          cargo agent doctor --format json
          cargo agent policy-check --format json
      - name: Diff-aware PR verification
        if: ${{ needs.reference-detect.outputs.changed != 'true' }}
        run: cargo agent verify --tier pr --base "${{ steps.base.outputs.sha }}" --format json
      - name: Current-head review evidence
        if: ${{ needs.reference-detect.outputs.changed != 'true' }}
        run: cargo agent review-pack --base "${{ steps.base.outputs.sha }}" --format json

  reference-detect:
    name: Detect reference changes
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.detect.outputs.base }}
      changed: ${{ steps.detect.outputs.changed }}
      paths: ${{ steps.detect.outputs.paths }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Detect immutable reference inputs
        id: detect
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base="$EVENT_BASE_SHA"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] || \
            ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base="$(git merge-base origin/main HEAD)"
          fi
          paths="$(
            git diff --name-only --diff-filter=ACDMRTUXB "$base...HEAD" | \
              awk '/^tests\/ref\// || /\.snap$/ || /\.hash$/ { print }'
          )"
          paths_json="$(jq -Rn --arg paths "$paths" '$paths | split("\n") | map(select(length > 0))')"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            echo "$paths_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ "$paths_json" == '[]' ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  reference-evidence:
    name: Reference evidence
    needs: reference-detect
    if: ${{ needs.reference-detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    environment: reference-human-approval
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Configure fetch-only upstream
        run: |
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/typst/typst.git
          git remote set-url --push upstream https://invalid.example/typst/typst.git
      - name: Materialize environment approval for exact head
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_PATHS_JSON: ${{ needs.reference-detect.outputs.paths }}
        run: |
          test -s review/reference-visual.md
          test -s review/reference-invariant-impact.md
          git ls-files --error-unmatch -- \
            review/reference-visual.md review/reference-invariant-impact.md
          approvals="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals"
          )"
          reviewer="$(
            jq -er '
              [
                .[]
                | select(
                    .state == "approved"
                    and any(
                      .environments[];
                      .name == "reference-human-approval"
                    )
                  )
              ]
              | last
              | .user.login
            ' <<<"$approvals"
          )"
          approval="$(git rev-parse --git-path typst-agent/reference-approval.json)"
          mkdir -p "$(dirname "$approval")"
          jq -n \
            --arg head_sha "$GITHUB_SHA" \
            --arg reviewer "$reviewer" \
            --argjson reference_paths "$REFERENCE_PATHS_JSON" \
            --arg visual_report review/reference-visual.md \
            --arg invariant_impact review/reference-invariant-impact.md \
            '{head_sha: $head_sha, reviewer: $reviewer, reference_paths: $reference_paths, visual_report: $visual_report, invariant_impact: $invariant_impact}' \
            > "$approval"
      - name: Verify current-head reference evidence
        run: |
          cargo agent verify --tier pr --base "${{ needs.reference-detect.outputs.base }}" --format json
          cargo agent review-pack --base "${{ needs.reference-detect.outputs.base }}" --format json

  fmt:
    name: Rustfmt
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.features }})
    needs: policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['--all-features', '--no-default-features']
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

  integration:
    name: Integration testit
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 100
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - run: cargo testit

  workspace:
    name: Upstream workspace (${{ matrix.os }})
    needs: policy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - run: cargo test --workspace --locked

  docs:
    name: Workspace docs
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - run: cargo doc --workspace --no-deps --document-private-items

  msrv:
    name: Minimum supported Rust
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # pinned installer
        with:
          toolchain: 1.92.0
      - run: cargo check --workspace --locked

  fuzz:
    name: Fuzz target build
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # pinned installer
        with:
          toolchain: nightly-2025-10-28
      - run: cargo install --locked cargo-fuzz@0.12.0
      - run: cd tests/fuzz && cargo fuzz build --dev

  miri:
    name: Miri
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # pinned installer
        with:
          toolchain: nightly-2025-10-28
          components: miri
      - run: cargo miri test -p typst-library test_miri

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Check commit sign-offs
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base="$EVENT_BASE_SHA"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] || \
            ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base="$(git merge-base origin/main HEAD)"
          fi
          git log --no-merges --format='%H%x00%B%x00' "$base..HEAD" | \
            awk -v RS='\0' 'NR % 2 == 0 && $0 !~ /Signed-off-by:/ { exit 1 }'
