name: Human owner approval

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: human-owner-approval-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  owner-approval:
    name: Human owner approval
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    environment: merge-single-owner
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Revalidate exact head and maintainer
        shell: bash
        run: |
          set -euo pipefail

          case "$PR_NUMBER" in
            1|2|3|4|5|6|7) ;;
            *)
              echo "The bootstrap owner gate is restricted to PR #1-#7." >&2
              exit 1
              ;;
          esac

          if [[ "$TRIGGERING_ACTOR" != "rixzkiye" ]]; then
            echo "The bootstrap run was not triggered by a repository maintainer." >&2
            exit 1
          fi

          current_pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current_head="$(jq -r '.head.sha' <<<"$current_pr")"
          current_base="$(jq -r '.base.ref' <<<"$current_pr")"
          current_state="$(jq -r '.state' <<<"$current_pr")"

          if [[ "$current_state" != "open" || "$current_base" != "main" ]]; then
            echo "The approved pull request must still be open and target main." >&2
            exit 1
          fi
          if [[ "$current_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "The pull request head changed after this approval run started." >&2
            exit 1
          fi

          printf 'approved_pr=%s\napproved_head_sha=%s\n' "$PR_NUMBER" "$EXPECTED_HEAD_SHA"
