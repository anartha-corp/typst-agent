[package]
name = "typst-agent-dev"
description = "Deterministic, model-free development control plane for Typst Agent."
publish = false
version = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = "https://github.com/anartha-corp/typst-agent"
repository = "https://github.com/anartha-corp/typst-agent"
license = { workspace = true }
readme = { workspace = true }

[[bin]]
# Deliberately not named `typst-agent`: the published CLI compiler in
# `typst-cli` owns that bin name. Sharing it makes
# `target/{debug,release}/typst-agent` order-dependent and breaks the CLI
# smoke tests whenever both packages are built in one verification run.
# `cargo agent` and the eval harness reach this binary through the package
# or its own path, never by name.
name = "typst-agent-ctl"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
