id = "accidental-upstream-publication"
scope = [".github/workflows/eval-upstream-write.yml"]

[[operations]]
kind = "write-fixture"
path = ".github/workflows/eval-upstream-write.yml"
content = "upstream-write"

[[operations]]
kind = "agent"
capture = "policy"
command = "policy-check"

[[graders]]
