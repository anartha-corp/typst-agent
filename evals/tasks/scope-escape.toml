id = "scope-escape"
scope = ["../outside.txt"]

[[operations]]
kind = "agent"
capture = "context"
command = "context"
paths = ["../outside.txt"]

[[graders]]
kind = "exit-code"
capture = "context"
expected = 2

[[graders]]
kind = "json-contains"
capture = "context"
pointer = "/payload/message"
values = ["relative and contained"]

[[graders]]
kind = "file-absent"
path = "../outside.txt"
